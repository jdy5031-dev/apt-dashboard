# 실거래 수집 + 대시보드 생성. 호가는 맥이 state/asking.json 으로 push 한다(네이버가 GitHub 서버 IP를 막음).
name: update
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (GitHub 사정으로 늦게 시작될 수 있음)
  push:
    branches: [main]
    paths: ["state/asking.json", "config.json", "build_dashboard.py", "collect_trades.py", "common.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실거래 수집
        # 직전 수집 후 6시간 이내면 알아서 건너뜀. 실패해도 대시보드는 만든다.
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python collect_trades.py
      - name: 대시보드 생성
        run: python build_dashboard.py
      - name: 커밋·push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/trades.json docs/index.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "실거래·대시보드 갱신"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
